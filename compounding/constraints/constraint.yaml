    - id: &l2p:e
      summary: E-plural nouns with stressed last syllable is the only class of words that can attach -e-.
      type: [morphological]
      regularity: NA
      coverage: NA

      examples_pro: [hunde]
      examples_contra: [herz_+e_leid]

      evidence:

          - ref: kürschner_2010
            pages: [9, 18]
            summary: -e- is always paradigmatic and occurs only after nouns with stressed last syllable [1].

          - ref: nübling_szczepaniak_2008
            pages: [5]
            summary: "In German, there are only two cases of non-paradigmatic linkers: -en- aften non-human M, and -s- after F [2]."

          - ref: nübling_szczepaniak_2013
            pages: [70, 81]
            summary: -e- is always paradigmatic.

          - ref: ortner_müller-bollhagen_1991
            pages: [102]
            summary: -e- is always paradigmatic, occurs mostly after simplexes and never after loanwords.

      footnotes:
          "1": The last claim explains why nouns like 'Teppich' do not attach -e- (teppich_boden).
          "2": Which implicitly points out that further overt markers (=er=, -e-, =e=, =) are always paradigmatic.        

   
    - id: &l2p:er
      summary: Er-plural nouns (these are few words, mostly N and some M, mostly simplices and never loanwords) is the only class of words that can attach =er=.
      type: [morphological]
      regularity: NA
      coverage: NA

      examples_pro: [buch_+=er_regal, kraut_+=er_frau, kind_+=er_jacke]
      examples_contra: []

      evidence:

          - ref: eisenberg_2013
            pages: [229]
            summary: =er= occurs only in er-plural nouns.

          - ref: kürschner_2010
            pages: [9, 11]
            summary: =er= only attaches to nouns forming the plural with -er (with or without umlaut) and is found in a few er-plural M and N [1].

          - ref: nübling_szczepaniak_2008
            pages: [3]
            summary: =er= is always paradigmatic.

          - ref: nübling_szczepaniak_2013
            pages: [80, 81]
            summary: =er= is always paradigmatic.

          - ref: ortner_müller-bollhagen_1991
            pages: [98]
            summary: =er= is always paradigmatic and attaches mostly to N and to some M, mostly simplexes, no loanwords.
            
      footnotes:
          "1": "[kürschner_2010:18] also mentions: '-er- occurs only after nouns with the stressed last syllable'; however, to the best of our knowledge, this always holds for er-plural nouns and, hence, for the nouns in question since =er= is always paradigmatic."


