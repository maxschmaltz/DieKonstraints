    - id: &p2l:drv:sfx:sfx-s|def-s
      summary: Nouns with suffixes -(ig)keit, -heit, -schaft, -ung, -sal, -ing, -ling, -tum, -um, -ion, -(i)tät regularly attach -s-.
      type: [derivational]
      regularity: NA
      coverage: NA

      examples_pro: [gesundheit_+s_amt, gesellschaft_+s_politik, schicksal_+s_drama, rarität_+s_wert, eigentum_+s_recht]
      examples_contra: [minderheit_+en_recht]

      evidence:

          - ref: eisenberg_2013
            pages: [230]
            summary: -s- occurs regularly after suffixes -(ig)keit, -heit, -tum, -schaft, -ung, -sal, -ling [1, 2].

          - ref: fuhrhop_kürschner_2015
            pages: [572]
            summary: -s- occurs regularly after suffixes -heit, -ung, -ling, -schaft, -tum, -ität [2].

          - ref: koliopoulou_2014
            pages: [61]
            summary: -s- follows first constituents that bear a prefix [5]. Furthermore, nouns with closing suffixes (-heit, -keit, -igkeit, -ling and -ung) are usually followed by -s- [2, 3].

          - ref: krott_etal_2007
            pages: [3]
            summary: -s- is inserted productively and automatically after certain suffixes [4].

          - ref: kürschner_2005
            pages: [107, 115]
            summary: Suffixes -heit, -keit, -ling, -ung, -schaft always require -s- [2, 3]. The probability of -s- increases [5] after suffixes -tum, -ion, -tät.

          - ref: kürschner_2010
            pages: [20, 21]
            summary: -s- regularly occurs after suffixes -heit, -schaft, -ling, -tum, -ung [3]. -s- also occurs [5] after suffixes -ität, -ion.

          - ref: nübling_szczepaniak_2008
            pages: [10, 20, 23]
            summary: -s- occurs regularly after suffixes -ung, -heit, -keit, -igkeit, -sal, -schaft, -ling, -ität, -ion [1]; derivations in -um also tend to adopt -s- [1].

          - ref: nübling_szczepaniak_2013
            pages: [77]
            summary: -s- regularly appears after suffixes -heit, -keit, -igkeit -schaft, -ung, -ion, and -ität [1].

          - ref: ortner_müller-bollhagen_1991
            pages: [73, 83, 88, 89, 94]
            summary: -s- regularly occurs with F ending in -ung, -beit, -keit, -igkeit, -schaft, -ität, -ion, -tum with a few exceptions, extensively occurs after -sal.

          - ref: schäfer_2018
            pages: [229]
            summary: Nouns with suffixes -heit, -ung, -tum etc. a strong tendency to adopt -s-.

          - ref: schäfer_pankratz_2018
            pages: [8]
            summary: Derivates with suffixes -ung, -heit, -tum etc. have a strong tendency to occur with an -s- linking element.

          - ref: schlücker_2023
            pages: [19]
            summary: -s- occurs with -schaft, -heit, -ung, -tum, -tät, -ion [3, 5].

          - ref: wegener_2003
            pages: [448]
            summary: -s- regularly occurs after suffixes -heit, -keit, -ung, -ling, -schaft [3].

      footnotes:
          "1": "Explanation: these are (semi-)stressed suffixes that form phonologically bad words. -s- is therefore used to mark the boundary of the phonological word ending with such a suffix."
          "2": "Explanation: -s- is used to mark a morphological boundary after a morphologically complex constituent."
          "3": "Explanation: these are (except for -schaft) closing suffixes, and -s- reopens the stem for further derivation."
          "4": Even though not explicitly stated, we assume that the authors refer to these suffixes, as, to the best of our knowledge, these are the only suffixes in German that regularly trigger the insertion of -s-. To be considered indirect evidence.
          "5": Level of regularity not mentioned.


