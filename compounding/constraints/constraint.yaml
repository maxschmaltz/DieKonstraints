# Part 3: ENTRIES

topology:

    - *def-0


    - id: &p2l
      summary: Constraints and clusters of constraints the map properties of compounds to most probable linkers.
      children:

          - id: &p2l:decl_cl
            summary: CLusters of constraint that map declination classes of compounds to most probable linkers.
            children:

                - id: &p2l:decl_cl:pl
                  summary: Clusters of constraints that map plural schemes of compounds to their most probable linkers.
                  children:

                      - id: &p2l:decl_cl:pl:#0-0
                        summary: Simplex masculine and neuter nouns ending with -el or -en that form the plural with a zero ending attach a zero linker in majority of cases. Derivatives forming the plural with a zero ending -- especially those with suffixes -er, -ler, -ner, -el, -sel, -chen, -lein -- attach a zero linking element regularly. Derivatives with suffix -en also attach a zero linker regularly unless they are a deverbative, in which case they always attach -s-.
                        children:

                            - *p2l:drv:sfx:0_pl_sfx-0 # EXTERNAL

                            - *p2l:decl_cl:pl:#0-0|smpx_mn_#el$/#en$-s

                            - *p2l:drv:sfx:deverb_#en$-s   # EXTERNAL

                      - id: &p2l:decl_cl:pl:#e-0
                        summary: Nouns forming the plural with -e mostly have a zero linker. In case of plural or collective meaning, they may also non-regularly attach -e-. Monosyllabic e-plural nouns designating animals may also non-regularly attach -e-. e-plural nouns is the only class of words that can attach this linker.
                        children:

                            - *p2l:decl_cl:pl:#e-0|def-0

                            - *p2l:decl_cl:pl:#e-0|pl_interpr-e

                            - *p2l:decl_cl:pl:#e-0|msyl_anim-e

                            - *l2p:e  # EXTERNAL

                      - id: &p2l:decl_cl:pl:#er-0/er
                        summary: Nouns forming the plural with -er (with or without umlaut) mostly attach a zero linker or =er= in different cases. Another linkers can also be rarely adopted by these nouns. =er= is more probable (with counterexamples) when a plural or collective meaning is present, in which case these nouns indicate concrete, countable entities, otherwise a zero linker is more probable. For person and animal designations though, =er= is not necessarily associated with a plural meaning. When having a mass meaning, these nouns tend (with counterexamples) to attach a zero linker. er-plural nouns (these are mostly N and some M, mostly simplices and never loanwords) is the only class of words that can attach this linker.
                        children:

                            - *p2l:decl_cl:pl:#er-0/er|def-0/er

                            - *p2l:decl_cl:pl:#er-0/er|!pl_interpr-0

                            - *p2l:decl_cl:pl:#er-0/er|mass-interpr-0

                            - *p2l:decl_cl:pl:#er-0/er|pl_interpr-er

                            - *p2l:decl_cl:pl:#er-0/er|anim-er

                            - *l2p:er  # EXTERNAL

                      - id: &p2l:decl_cl:pl:#e_uml-0
                        summary: Nouns forming the plural with -e and an umlaut mostly have a zero linker. In case of plural or collective meaning they may also non-regularly attach -e- with an umlaut. Nouns forming the plural with -e and an umlaut is the only class of words that can attach this linker.
                        children:

                            - *p2l:decl_cl:pl:#e_uml-0|def-0

                            - *p2l:decl_cl:pl:#e_uml-0|pl_interpr-e_uml

                            - *l2p:e_uml  # EXTERNAL

                      - id: &p2l:decl_cl:pl:#0_uml-0
                        summary: Nouns forming the plural with a zero ending and an umlaut mostly have a zero linker. In case of plural or collective meaning they may also non-regularly attach a zero linker with an umlaut. Nouns forming the plural with a zero ending and an umlaut is the only class of words that can attach this linker.
                        children:

                            - *p2l:decl_cl:pl:#0_uml-0|def-0

                            - *p2l:decl_cl:pl:#0_uml-0|pl_interpr-0_uml

                            - *l2p:0_uml  # EXTERNAL
                
                - id: &p2l:decl_cl:mixed-0/s/en
                  summary: Mixed masculine and neuter nouns can attach -s-, a zero linker, or -(e)n-. The latter may be associated with a plural or collective meaning (with counterexamples).
                  children:

                      - *p2l:decl_cl:mixed-0/s/en|def-0/s/en

                      - *p2l:decl_cl:mixed-0/s/en|pl_interpr-en


          - id: &p2l:drv
            summary: Clusters of constraints that map derivational classes of compounds to most probable linkers.
            children:

                - id: &p2l:drv:sfx
                  summary: Clusters of constraints that map derivational suffixes of compounds to most probable linkers.
                  children:

                      - *p2l:drv:sfx:0_pl_sfx-0

                      - *p2l:drv:sfx:!0_pl_sfx-0

                      - id: &p2l:drv:sfx:sfx-s
                        summary: Nouns with suffixes -(ig)keit, -heit, -schaft, -ung, -sal, -ing, -ling regularly, and nouns with suffixes -(t)um, -ion tendentially attach -s-. Suffix -(i)tät also regularly attaches -s- unless there is a plural interpretation, in which case -en- is preferred.
                        children:

                            - *p2l:drv:sfx:sfx-s|def-s

                            - *p2l:drv:sfx:sfx-s|#itaet$_pl_interpr-en

                      - *p2l:drv:sfx:deverb_#en$-s

                      - *p2l:drv:sfx:F_#in$-en

                - *p2l:drv:prx_deverb-s
                

          - id: &p2l:phon_fin
            summary: Clusters of constraints that map final phoneme(s) of compounds to most probable linkers.
            children:

                - *p2l:phon_fin:sibilant$-0

                - *p2l:phon_fin:cmpx_syl$-0

                - *p2l:phon_fin:vow$-0

                - *p2l:phon_fin:F_stem_#t$-s

                - id: &p2l:phon_fin:schwa$-en
                  summary: Nouns ending in schwa regularly adopt -n- if the schwa is not a suffix. If the schwa is a suffix of a deadjective feminine noun, -n- and zero linkers are about equally possible. Deverbal feminine nouns with the schwa suffix mostly attach a zero linker but can attach an -n- when the first constituent has a plural reading. Nouns ending in schwa is the only class of words that can attach the allomorph -n- of the en-linker.
                  children:

                      - *p2l:phon_fin:schwa$-en|def-en

                      - *p2l:phon_fin:schwa$-en|deadj-0/en

                      - *p2l:phon_fin:schwa$-en|deverb-0

                      - *p2l:phon_fin:schwa$-en|deverb_pl_interpr-en

                      - *l2p:n  # EXTERNAL

                - id: &p2l:phon_fin:weak_F_cons$-0/s/en
                  summary: "Consonant-final weak feminine nouns mostly adopt -en-, a zero linker, or -s-. It is possible that there is a tendency to choose by singular/plural meaning: if the second constituent forces the first constituent to take a collective or plural meaning, -en- is more likely (especially in final-stressed incl. monosyllabic feminine nouns), otherwise mostly a zero linker or -s- is chosen."
                  children:

                      - *p2l:phon_fin:weak_F_cons$-0/s/en|!pl_interpr-0/s

                      - *p2l:phon_fin:weak_F_cons$-0/s/en|pl_interpr-en


          - id: &p2l:sem
            summary: Clusters of constraints that map semantic properties of compounds/first constituents to most probable linkers.
            children:

                - id: &p2l:sem:comp_type
                  summary: Clusters of constraints that map compound types to most probable linkers.
                  children:

                      - *p2l:sem:comp_type:copula-0

                      - *p2l:sem:comp_type:arg-0

                - *p2l:sem:tech_term-0

                - *p2l:sem:2const_anim/pers-0


          - id: &p2l:tend
            summary: Clusters of constraints that describe general irregular tendencies.
            children:

                - id: &p2l:tend:cmpx_morph-s
                  summary: The acceptability of -s- irregularly grows when the first constituent is morphologically complex (any form of derivation).
                  children:

                      - *p2l:tend:cmpx_morph-s|def-s

                      - *p2l:drv:sfx:sfx-s|def-s  # EXTERNAL

                      - *p2l:drv:sfx:deverb_#en$-s  # EXTERNAL

                      - *p2l:drv:prx_deverb-s  # EXTERNAL

                - id: &p2l:tend:cmpx_phon-s
                  summary: "The acceptability of -s- irregularly grows when the first constituent is phonologically complex: non-trochaic form, words with unstressed prefixes, words with stressed or semi-stressed suffixes etc."
                  children:

                      - *p2l:tend:cmpx_phon-s|def-s

                      - *p2l:drv:sfx:sfx-s|def-s  # EXTERNAL

                      - *p2l:drv:prx_deverb-s  # EXTERNAL

                - *p2l:tend:sonority-!s

                - id: &p2l:tend:pl_interpr-pl_marker
                  summary: Linkers identical to the plural ending can be associated with plural meaning.
                  children:

                      - *p2l:tend:pl_interpr-pl_marker|def-pl_marker

                      - *p2l:decl_cl:pl:#e-0|pl_interpr-e   # EXTERNAL

                      - *p2l:decl_cl:pl:#er-0/er|pl_interpr-er    # EXTERNAL

                      - *p2l:decl_cl:pl:#e_uml-0|pl_interpr-e_uml   # EXTERNAL

                      - *p2l:decl_cl:pl:#0_uml-0|pl_interpr-0_uml   # EXTERNAL

                      - *p2l:decl_cl:mixed-0/s/en|pl_interpr-en   # EXTERNAL

                      - *p2l:drv:sfx:sfx-s|#itaet$_pl_interpr-en    # EXTERNAL

                      - *p2l:phon_fin:schwa$-en|deverb_pl_interpr-en  # EXTERNAL

                      - *p2l:phon_fin:weak_F_cons$-0/s/en|pl_interpr-en  # EXTERNAL


    - id: &l2p
      summary: Constraints that restrict properties of compounds appearing with certain linkers.
      children:

          - *l2p:s

          - *l2p:n

          - id: &l2p:en
            summary: Only nouns forming the plural with -(e)n can attach -(e)n- as a linking element with a very few idiosyncratic exceptions where -(e)n- occurs after nouns not forming the plural with -(e)n. The exceptions are 1) a few monosyllabic masculine nouns designating male persons, animals, astronomic objects, months, and 2) polysyllabic foreign neuter nouns with final stress (mostly ending with -at and -ment) that adopt -en- only when they express plurality.
            children:

                - *l2p:en|par

                - *l2p:en|non_par_m

                - *l2p:en|non_par_n_pl_interpr

          - *l2p:e          

          - *l2p:er

          - *l2p:e_uml

          - *l2p:es

          - *l2p:ens

          - *l2p:0_uml


constraints:

    - id: &def-0
      summary: The majority of compounds have a zero linker. Zero linker is default for German compounds.
      type: [default]
      regularity: NA
      coverage: NA

      examples_pro: [land_kreis, haus_tür, stadt_mauer]
      examples_contra: [land_+es_regierung, haus_+=er_block, stadt_+=e_tag]

      evidence:

          - ref: eisenberg_2013
            pages: [226]
            summary: 73% of compounds have a zero linker.

          - ref: fuhrhop_kürschner_2015
            pages: [569]
            summary: 70% of compounds have a zero linker.

          - ref: kopf_2017
            pages: [177]
            summary: About 60% of compounds have a zero linker.

          - ref: krott_etal_2007
            pages: [3]
            summary: 60% of compounds have a zero linker.

          - ref: kürschner_2005
            pages: [107]
            summary: 58% of compounds have a zero linker.

          - ref: libben_etal_2009
            pages: [150, 156]
            summary: The majority of compounds have a zero linker.

          - ref: nübling_szczepaniak_2008
            pages: [2]
            summary: In most German compounds there is no linking element.

          - ref: ortner_müller-bollhagen_1991
            pages: [50, 52, 54, 103]
            summary: Most nominal compounds have a zero linker (in about 2/3 of cases).

          - ref: schäfer_pankratz_2018
            pages: [8, 9]
            summary: 65-70% of compounds have a zero linker.

          - ref: schlücker_2012
            pages: [9]
            summary: Zero linker prevails in nominal compounds.

      footnotes: {}


    # 1. Constraints the map properties of compounds to most probable linkers.

    #   1.1. Constraints that map declination classes of compounds to most probable linkers.

    #     1.1.1. Constraints that map plural schemes of compounds to their most probable linkers.

    - id: &p2l:decl_cl:pl:#0-0|smpx_mn_#el$/#en$-s
      summary: Simplex masculine and neuter nouns ending with -el or -en that form the plural with a zero ending attach -s- in majority of cases.
      type: [morphological]
      regularity: NA
      coverage: NA

      examples_pro: [orden_+s_bruder, teufel_+s_werk, frieden_+s_angebot]
      examples_contra: [schlitten_fahrt, wagen_rad]

      evidence:

          - ref: ortner_müller-bollhagen_1991
            pages: [82, 88, 106]
            summary: Simplex M and N ending in -en or -el that form the plural with a zero ending attach -s- in majority of cases.

      footnotes: {}



    - id: &p2l:decl_cl:pl:#s-0
      summary: Nouns forming the plural with -s regularly attach a zero linker.
      type: [morphological]
      regularity: NA
      coverage: NA

      examples_pro: [balkon_möbel, hotel_kette, bob_bahn]
      examples_contra: []

      evidence:

          - ref: eisenberg_2013
            pages: [227]
            summary: -s- is avoided with s-plural nouns.
          
          - ref: fuhrhop_kürschner_2015
            pages: [572]
            summary: -s- is impossible with s-plural nouns.

          - ref: kürschner_2010
            pages: [9]
            summary: -s- almost never occurs with s-plural nouns.

          - ref: nübling_szczepaniak_2013
            pages: [78]
            summary: -s- does not occur in s-plural nouns.
          
          - ref: ortner_müller-bollhagen_1991
            pages: [83, 106]
            summary: s-plural nouns have a zero linker as a rule.
          
          - ref: schäfer_2018
            pages: [229]
            summary: s-plural nouns never attach -s-.
      
      footnotes: {}



    - id: &p2l:decl_cl:pl:#e-0|def-0
      summary: Nouns forming the plural with -e mostly have a zero linker.
      type: [morphological]
      regularity: NA
      coverage: NA

      examples_pro: [tisch_decke, projekt_gruppe, pilz_sammler]
      examples_contra: [tag_+e_gericht, projekt_+e_macherei, hund_+e_leine]

      evidence:

          - ref: ortner_müller-bollhagen_1991
            pages: [83]
            summary: e-plural nouns rarely have explicit linkers.

      footnotes: {}


    - id: &p2l:decl_cl:pl:#e-0|pl_interpr-e
      summary: Nouns forming the plural with -e non-regularly attach -e- when the second constituent forces a plural or collective meaning of this noun.
      type: [morphological, semantic]
      regularity: NA
      coverage: NA

      examples_pro: [projekt_+e_macherei, tag_+e_buch, punkt_+e_stand]
      examples_contra: [pilz_sammler, brot_korb, jahr_zehnt, tag_+e_lohn]

      evidence:

          - ref: ortner_müller-bollhagen_1991
            pages: [103]
            summary: -e- mostly signalizes a plural or collective meaning.'

          - ref: schäfer_pankratz_2018
            pages: [29]
            summary: -e- exhibits insignificant effect on plural reading [1].

      footnotes:
          "1": This finding is not very reliable. Most of the entries in the dataset were nouns designating animals -- that, as pointed out in the literature, tendentially attach -e- with no respect to the plural meaning (see `p2l:decl_cl:pl:#e-0|msyl_anim-e`). Furthermore, the sample contained noise such as 'Arzt' which is a e=plural noun. Thus, making a single conclusion about all occurrences from different classes adopting -e- may be misleading since strong effect of one class may be wiped out by the absence of the same effect for the others. However, since even with this averaging over the classes, the overall effect is positive (even if weakly), we include this finding in the evidence, assuming the effect of -e- after non-animal designations was most probably positive as well.


    - id: &p2l:decl_cl:pl:#e-0|msyl_anim-e
      summary: Monosyllabic e-plural nouns designating animals non-regularly attach -e-.
      type: [morphological, semantic]
      regularity: NA
      coverage: NA

      examples_pro: [hund_+e_leine, swein_+e_stall, pferd_+e_wagen]
      examples_contra: [hund_+s_stern, schwein_kram, schaff_stall]

      evidence:

          - ref: eisenberg_2013
            pages: [228]
            summary: A larger group where -e- occurs is animal designations, but certainly not with all of them.

          - ref: nübling_szczepaniak_2008
            pages: [11]
            summary: There is an observable tendency to insert -e- after nouns designating animals with many counterexamples.

          - ref: nübling_szczepaniak_2013
            pages: [81]
            summary: -e- occurs most frequently and even partly productively after monosyllabic nouns denoting animals.

      footnotes: {}



    - id: &p2l:decl_cl:pl:#er-0/er|def-0/er
      summary: Nouns forming the plural with -er (with or without umlaut) mostly attach a zero linker or =er= in different cases. Another linkers can also be rarely adopted by these nouns.
      type: [morphological]
      regularity: NA
      coverage: NA

      examples_pro: [buch_deckel, buch_+=er_regal, kind_+=er_jacke]
      examples_contra: [kind_+es_alter, mann_+s_volk]

      evidence:

          - ref: eisenberg_2013
            pages: [229]
            summary: er-plural nouns tend to choose =er= [when a plural meaning is present], otherwise a zero linker [1].

          - ref: ortner_müller-bollhagen_1991
            pages: [99]
            summary: Most er-plural nouns attach both =er= or a zero linker in different cases.

      footnotes:
          "1": Even though original text reads 'otherwise a zero linker or another linker', none of the provided examples illustrate the use of linkers other than zero or =er=.


    - id: &p2l:decl_cl:pl:#er-0/er|!pl_interpr-0
      summary: Nouns forming the plural with -er (with or without umlaut) attach a zero linker in majority of cases when the second constituent forces a singular meaning of this noun.
      type: [morphological, semantic]
      regularity: NA
      coverage: NA

      examples_pro: [buch_deckel, grab_stein, blatt_fläche]
      examples_contra: [mann_+=er_herz, kind_+=er_bild]

      evidence:

          - ref: eisenberg_2013
            pages: [229]
            summary: Nouns forming the plural with -er (with or without umlaut) tend to choose a zero linker [1] when no plural meaning is present.
            
          - ref: ortner_müller-bollhagen_1991
            pages: [99, 108]
            summary: 80% er-plural nouns having a singular meaning choose a zero linker [2].
            
      footnotes:
          "1": Even though original text reads 'otherwise a zero linker or another linker', none of the provided examples illustrate the use of linkers other than zero or =er=.
          "2": Note that non-N+N compounds are included in this statistics.


    - id: &p2l:decl_cl:pl:#er-0/er|mass-interpr-0
      summary: Nouns forming the plural with -er (with or without umlaut) tend (with counterexamples) to attach a zero linker when the second constituent forces a mass meaning of this noun.
      type: [morphological, semantic]
      regularity: NA
      coverage: NA

      examples_pro: [glas_auge, kraut_salat, horn_haut]
      examples_contra: []

      evidence:

          - ref: ortner_müller-bollhagen_1991
            pages: [101]
            summary: When having a mass meaning, er-plural nouns tend to attach a zero linker [1].

      footnotes:
          "1": "Generalization taken from [nübling_szczepaniak_2013:81]."


    - id: &p2l:decl_cl:pl:#er-0/er|pl_interpr-er
      summary: Nouns forming the plural with -er (with or without umlaut) attach =er= more likely when the second constituent forces a plural or collective meaning of this noun (with counterexamples), in which case these nouns indicate concrete, countable entities.
      type: [morphological, semantic]
      regularity: NA
      coverage: NA

      examples_pro: [buch_+=er_regal, grab_+=er_feld, kraut_+=er_frau]
      examples_contra: [buch_handel, bild_band]

      evidence:

          - ref: eisenberg_2013
            pages: [229]
            summary: er-plural nouns tend to choose =er= when a plural meaning is present.

          - ref: nübling_szczepaniak_2013
            pages: [80, 81]
            summary: =er= is often associated with plural meaning, with many counterexamples.

          - ref: ortner_müller-bollhagen_1991
            pages: [99]
            summary: er-plural often attach =er= to signalize plural meaning, in which case they indicate concrete, countable entities.

          - ref: schäfer_pankratz_2018
            pages: [29]
            summary: =er= with no umlauting exhibits moderate, and =er= with umlauting exhibits significantly strong effect on plural reading.
            
      footnotes: {}
    

    - id: &p2l:decl_cl:pl:#er-0/er|anim-er
      summary: Nouns forming the plural with -er (with or without umlaut) that designate persons and animals may attach =er= also with singular interpretation.
      type: [morphological, semantic]
      regularity: NA
      coverage: NA

      examples_pro: [kind_+=er_jacke, huhn_+=er_ei, rind_+=er_brust]
