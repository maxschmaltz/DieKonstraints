    - id: &p2l:drv:sfx:0_pl_sfx-0
      summary: Derivatives forming the plural with a zero ending -- especially those with suffixes -er, -ler, -ner, -el, -sel, -chen, -lein -- attach a zero linking element regularly.
      type: [derivational]
      regularity: NA
      coverage: NA

      examples_pro: [reiter_schwert, gürtel_schnalle, brötchen_geber]
      examples_contra: [reiter_+s_mann, leben_+s_mittel]

      evidence:

          - ref: ortner_müller-bollhagen_1991
            pages: [56, 82, 106]
            summary: Derivatives forming the plural with a zero ending -- especially those with suffixes -er, -ler, -ner, -el, -sel, -chen, -lein -- attach a zero linking element regularly.

      footnotes: {}




    - id: &p2l:drv:sfx:deverb_#en$-s
      summary: -s- occurs regularly in deverbatives ending in -en.
      type: [derivational]
      regularity: NA
      coverage: NA

      examples_pro: [leben_+s_mittel, essen_+s_gewohnheit, schlaf_+en_zeit]
      examples_contra: []

      evidence:

          - ref: eisenberg_2013
            pages: [230]
            summary: -s- occurs by a rule in deverbatives ending in -en.
           
          - ref: kürschner_2005
            pages: [107]
            summary: Deverbatives ending in -en build compounds with -s-.
          
          - ref: nübling_szczepaniak_2013
            pages: [78]
            summary: Deverbatives ending in -en always attach -s-.
          
          - ref: ortner_müller-bollhagen_1991
            pages: [89]
            summary: Deverbative neuter nouns with suffix -en regularly attach -s-.

      footnotes: {}




    - id: &l2p:e
      summary: E-plural nouns with stressed last syllable is the only class of words that can attach -e-.
      type: [morphological]
      regularity: NA
      coverage: NA

      examples_pro: [hunde]
      examples_contra: [herz_+e_leid]

      evidence:

          - ref: kürschner_2010
            pages: [9, 18]
            summary: -e- is always paradigmatic and occurs only after nouns with stressed last syllable [1].

          - ref: nübling_szczepaniak_2008
            pages: [5]
            summary: "In German, there are only two cases of non-paradigmatic linkers: -en- aften non-human M, and -s- after F [2]."

          - ref: nübling_szczepaniak_2013
            pages: [70, 81]
            summary: -e- is always paradigmatic.

          - ref: ortner_müller-bollhagen_1991
            pages: [102]
            summary: -e- is always paradigmatic, occurs mostly after simplexes and never after loanwords.

      footnotes:
          "1": The last claim explains why nouns like 'Teppich' do not attach -e- (teppich_boden).
          "2": Which implicitly points out that further overt markers (=er=, -e-, =e=, =) are always paradigmatic.