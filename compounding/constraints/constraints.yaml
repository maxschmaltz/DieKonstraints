# Part 1: README and notes

readme: |

    ## About

    This document contains the list of constraints governing the choice of linking elements in German N+N compounds and restrictions on this choice, and supporting material.
    
    The constraints are organized in a topological structure. In this structure, the constraints might be a part of a constraint cluster, in which case the cluster collects all constraints targeting the same class of nouns. Singular constraints and constraint clusters are joined in groups of clusters with respect to the linguistic status of the properties they describe.

    For each constraint, its linguistic type, regularity, coverage, examples pro and contra, and evidence from the literature are provided.
    
    Note that constraint clusters are designed such that more general constraints in them overlap with more specific constraints, so that the latter override the former for certain inputs. This is done on purpose to be able to inspect the behavior of LLMs when operating with conflicting constraints. From linguistic point of view, the more general constraints might be slightly inaccurate since edge cases are omitted there on purpose to enforce overlapping. For example, the general constraint for schwa-final nouns (`p2l:phon_fin:schwa$-en|f-en`) reads 'First constituents that are constituted by feminine nouns that end in schwa adopt -(e)n- regularly.' whereas there are in fact some exceptions not mentioned. The exceptions are then captured in more specific constraints of the same cluster (e.g. `p2l:drv:deverb_schwa$-0|def-0`: 'First constituents that are constituted by deverbal feminine nouns with a schwa suffix mostly attach a zero linker.'), so that the LLM has to choose between the general and the specific constraint when presented with a noun to which both are applicable (deverbal feminine noun ending in schwa in this case, e.g. 'Tiefe'). For linguistically accurate descriptions in such cases, refer to the descriptions of the parent constraint clusters, e.g. `p2l:phon_fin:schwa$-en` reads '... feminine nouns that end in schwa do so regularly except for the following cases. If ...'.

    Both the constraints, the constraint clusters, and their topological structure are given in Part 3 below. Part 2 contains the glossary of abbreviations and linker designations used in the document.


    ## On understanding constraint ids

    Constraints ids and constraint cluster ids are designed to provide instant information about the constraint they represent.
    Every constraint id consists of a path and a descriptor -- a codified description of the constraint (cluster) itself.
    The path and the descriptor are separated by the last colon in the id.
    The path describes the location of the constraint (cluster) in the topology (see topology below).
    The information encoded in descriptor depends on the topological type of the constraint (cluster) (see topology below). The topological type of a constraint (cluster) is also included at the beginning of the path.
    
     The descriptors of the default constraint and the `p2l` constraints and constraint clusters consist of two parts separated by a hyphen. They codify the properties of the compounds in the left part and the most probable linker(s) in the right part. If a constraint is a part of a cluster, its descriptor is divided by a vertical bar into the cluster descriptor (on the left) and more specific constrain descriptor (on the right). The linguistic status of the compound properties can be inferred from the topological path. For codes of the properties see the glossary below.
    
     The descriptors of the `l2p` constraint clusters directly specify the linkers they target.

    Examples:
    
     `p2l:decl_cl:pl:#e-0|msyl_anim-e` -- the path of the id says that this constraint describes a certain compound property that determines the most probable linker(s) (`p2l`); more specifically, it maps a certain declination class (`decl_cl`), namely, a plural formation scheme (`pl`), to the most probable linker(s); the descriptor specifies that the constraint belongs to the cluster of constraints targeting e-plural nouns (`#e-`) which mostly attach a zero linker (`-0`); however, the constraint itself holds that monosyllabic (`msyl`) animal designations (`anim`) prefer -e- (-e). Reading: even though e-plural nouns mostly attach a zero linker, those designating animals prefer -e-.

     `l2p:s` -- the path of the id says that this constraint describes the restrictions put on the nouns that may attach a certain linker (`l2p`); the descriptor specifies that the constraint targets the s-linker (`s`). Reading: restrictions on compounds with an s-linker.


    ## On understanding linkers

    All linkers (except for '_' -- zero linker) are separated from the left and the right constituents by underscores. In the middle part, the linker is specified after a plus sign. Note that linker ids specify concrete allomorphs of the linkers (e.g. _+n_ and _+en_ are allomorphs of the en-linker). If the plus sign is followed by an equal sign, the linker puts umlaut on the stem vowel of the left constituent (for _+=er_: whenever applicable).
    The full list of linker ids is given in the linkers glossary below.


    ## On reading evidence

    There are a few abbreviations used in the evidence summaries of the constraints: M/N/F -- masculine/neuter/feminine nouns; xx-plural -- nouns forming the plural with the ending xx; xx=plural -- nouns forming the plural with the ending xx with umlaut; =plural -- nouns forming the plural with umlaut but no explicit ending. Linkers are represented in a plain text and share the notation scheme with plural designations: -x- -- linker x; =x= -- linker x with umlaut; = -- a zero linker with umlaut.


    ## Changelog

    * Evidence from the literature was gathered
    * The claims about the constraints within the evidence were summarized into constraint definitions
    * The constraints were classified by the type of linguistic information they exploit, based on the definitions
    * The constraints were clustered by classes of nouns to which they apply; namely, constraints targeting the same class or constraints in hypo-/hypernymy relations were clustered together
    * The clustered were organized hierarchically by the type of their application, partially overlapping with the linguistic classification
    * After conducting the corpus experiments, item and type coverage and regularity were added manually; these are to be found in `resources/custom/compounding/applicability_statistics/constr_statistics.tsv`. The reason for manual adding was to keep the meaningful indent/space organization of the present YAML.
    * The quantifiers from the constraint definitions were extracted for a more convenient comparison of the claims in the literature and the empirical data, hence, an easier estimation of the empirical support of the said claims (see `compounding/constraints/check_applicability/inspect.ipynb`, section 3).
    * Finally, the verdicts about the support level of the constraints were made. Since the definitions are mostly vague, the decisions were based on commonsense judgments. For the support level, we concentrated on the type variant of the measures since we focused on the linguistic side of the question (not speaker usage). We distinguished 4 levels of support:
        * Supported. Full or very close correspondence between the quantifier and the empirical data. Examples: "regular" vs 0.99, "mostly" vs 0.75.
        * Partially supported. The gap is not critical yet noticeable. Examples: "regular" vs 0.93, "tends" vs 0.6, "sometimes" vs 0.9.
        * Not supported. The discrepancy between the quantifier and the empirical data is too significant to ignore. Examples: "regular" vs 0.85, "tends" vs 0.4.
        * NA: no data available (unreliable or semantic/lexical constraints).
    * Add the application item property. This property specifies what exact part of the compound is targeted by a given constraint. There are 4 possible types:
        * N1. This will be the case for the majority of the constraints.
        * N1 + linker. This is for the L2P constraints, where one N1 may or may not attach the target linker in different compounds, and then only the cases when it does attach it matter; for example, if we consider compounds `mutter_sprache` and `mutter_+=_zentrum`, N1 'mutter' will become the application item for `p2l:decl_cl:pl:#0_uml-0|def-0` but only that case of 'mutter' that does attach a `_+=_` will be the item of application for `l2p:0_uml`. This derives directly from the definitions of these constraints: "... nouns that build the plural form with a zero ending and umlaut" vs "... nouns ... that attach a zero linker with umlaut"
        * N2. For `p2l:sem:2const_anim/pers-s`.
        * The whole compound. This is for the cases when the semantic type of the whole compounds matters, such as `p2l:sem:comp_type:copula-0`.
    * Add counts of application items of each type.
    * Detalized a few constraints.



notes:

    - "Since we disregard weak M from research due to their absolute regularity, the corresponding evidence is excluded. Those are: [eisenberg_2013:228], [fuhrhop_kuerschner_2015:573], [kuerschner_2005:119], [kuerschner_2010:9], [ortner_mueller-bollhagen_1991:91], [schaefer_pankratz_2018:9]."

    - "Since we consider only N+N compounds, we exclude constraints targeting complex first constituents. These are: 1) -s- occurs more frequently with complex first constituents compared to the corresponding simplex and sometimes replaces the default simplex linker ([koliopoulou_2014:61], [kuerschner_2005:108,110,111,112], [ortner_mueller-bollhagen_1991:85]), 2) the more complex the first part of a compound, the more probable the occurrence of a linking element ([nuebling_szczepaniak_2008:9]); 3) -s- can signalize the head boundary ([kuerschner_2005:112], [kuerschner_2010:22], [nuebling_szczepaniak_2008:8], [wegener_2005:180,184]); 4) the probability of -s- after a compound is comparable to that after derivatives with stressed prefixes and is about 27-37% ([nuebling_szczepaniak_2008:21], [nuebling_szczepaniak_2013:78], for criticism on these statistics see footnote 3 of `p2l:drv:prx_deverb-s`). More on the structure marking function of -s- in compounds with three constituents see https://doi.org/10.1177/00238309040470010401."

    - "The following fact is disregarded from the constraints despite its restraining nature: syllabic linkers attach only to final-stressed (including monosyllabic), and non-syllabic -- only to polysyllabic non-final-stressed nouns, which aids in forming/maintainign trochees: rule for -(e)n-, -es-, -e-, -\"e-, -\"er-, -(e)ns-, tendency for -s- (more on that in [kopf_2017:195], [kuerschner_2010:17], [nuebling_szczepaniak_2008:7,17], [nuebling_szczepaniak_2013:79], [schluecker_2023:19], [wegener_2003:446], [wegener_2005:178]). The reason for disregarding this fact is its determinacy by other constraints: 1) none of these linkers can appear after a full vowel (see `p2l:phon_fin:vow$-0`), hence, they may appear either after a schwa, or after a consonant; 2) allomorphs of -(e)n-, -(e)ns- are distributed regularly depending on whether the noun ends with a schwa: thus, -n- and -ns- will appear only after schwa, otherwise -en-, -ens- (see constraints dealing with these linkers) (exception: F on -in (see `p2l:drv:sfx:F_#in$-en`), but there German avoids final -inn); 3) -e-, -\"e-, -\"er- are paradigmatic (see corresponding `l2p` constraints), and all e-plural, e=plural, er=plural nouns are consonant-final; 4) -es- appears only after a row of monosyllabic nouns (see `l2p:es`); 5) there are only a few monosyllabic nouns attaching an -s- (see `l2p:s|smpx_mn`). Thus, this fact rather summarizes the outcomes governed by other constraints but does not govern anything itself. Thus, it cannot bring any additional filter on any noun since it will always give the same output as the corresponding constraints provided above."

    - "Despite the findings from [krott_etal_2007] concerning analogical effects are promising, we disregard them as well from this iteration. These are: 1) there is a significant left bias for choosing a link (-en-, -s- and zero linker were investigated), that is, a noun tending to usually choose -x- will more probably also choose -x- in novel compounds [krott_etal_2007:7,9]; 2) apart from the left bias, gender was a significantly predictive feature for -en- and zero linker, and inflectional class -- on -s- and zero linker [krott_etal_2007:9]. The reason for excluding this findings is that we believe these analogical effects are an accumulative product of acquisition and (subconscious) application of all compounding constraints present in German. Such, it cannot be a constraint itself and is rather a combined account of the investigated constraints."

    - In the constraints that draw on the singular/plural meaning of the first constituents (such as ``, `` etc.), the definitions are generally given as "First constituents that ... attach -x- in compounds in which the second constituent forces a singular/plural meaning of this first constituent". For such constraints, we may sometimes add counterexamples where -x- is attached when the opposite meaning of the first constituent is forced by the second constituent (e.g. -(")er- with a singular meaning). Strictly speaking, these are no real counterexamples to this constraints, since they do not say anything about this opposite meaning. Such counterexamples are added purely for a better illustrativity of the irregularity of singular/plural meaning effect and are separated by a tab from the real counterexamples.

    - We adhere to the framework that assigns to affixes a scheme defining the morphological and semantic properties of the input for derivation and its result. Thus, even if the morphological class of an input of a derivational constraint is restricted, we do not claim this constraint to also have a morphological character since we assume this morphological information is embedded in the affix. For example, we categorize `p2l:drv:sfx:F_#in$-en` or `p2l:drv:sfx:0_pl_sfx-0` as purely derivational constraint as this exact suffix -in takes certain Xs as the input and always produces an F with certain semantic properties, or suffixes -er, -el etc. always produce zero-plural nouns.

    - When dealing with morphological constraints, simplices are meant by default. Otherwise, "derivational" type is specified in addition. This is, among other, the reason why `l2p:s|smpx_mn` is classified as purely morphological, and `l2p:s|f` -- as both morphological and derivational.
---


# Part 2: GLOSSARY  LINKER DESIGNATIONS

glossary:
    "!": "[negation]"
    "#": "[marks a literal (phoneme, suffix, etc.) ahead]"
    "$": "[marks that the noun ends with a literal (phoneme, suffix, etc.) behind]"
    2const: second constituent
    anim: animal designation
    arg: argumental compound
    cl: class
    cmpx: complex (in different contexts)
    comp: compound
    cons: consonant
    copula: copula compound
    deadj: deadjectival
    decl: declination
    def: default
    deverb: deverbal
    drv: derivative
    f: feminine noun
    freq: frequency
    interpr: interpretation
    isol: isolated
    loan: loanword
    m: masculine noun
    morph: morphological
    msyl: monosyllabic
    n: neuter noun
    p2l: properties to linkers
    fin: final
    par: paradigmatic
    pers: person
    phon: phonological
    pl: plural
    prx: prefix
    sem: semantics of the compound/first constituent
    sfx: (derivational) suffix
    smpx: simplex noun
    syl: syllable
    tech: technical
    tend: tendency
    uml: umlaut
    vow: full vowel


linkers:
    _: zero linker
    _+s_: s-linker
    _+n_: en-linker (allomorph after schwa)
    _+en_: en-linker (allomorph after consonant)
    _+e_: e-linker
    _+=er_: er-linker (puts umlaut whenever possible)
    _+=e_: e-linker with umlaut
    _+es_: es-linker
    _+ns_: ens-linker (allomorph after schwa)
    _+ens_: ens-linker (allomorph after consonant)
    _+=_: zero linker with umlaut

---


# Part 3: ENTRIES

topology:

    # 1
    - def-0


    - p2l:
    
        summary: Constraints and clusters of constraints that map different properties of compounds to the most probable linkers.
        children:


            - p2l:decl_cl:

                summary: Clusters of constraints that map declination classes of compounds to the most probable linkers.
                children:


                    - p2l:decl_cl:pl:

                        summary: Clusters of constraints that map plural formation schemes of compounds to the most probable linkers.
                        children:

                            # 2
                            - p2l:decl_cl:pl:#0-0:
                                summary: First constituents that are constituted by nouns that build the plural form with a zero ending --- especially those with suffixes -er, -ler, -ner, -el, -sel, -chen, -lein --- attach a zero linking element almost regularly. However, first constituents that are constituted by deverbal nouns that end in suffix -en (which build the plural form with a zero ending) attach -s- regularly.
                                children:

                                    - p2l:decl_cl:pl:#0-0|def-0

                                    - p2l:drv:sfx:0_pl_sfx-0 # EXTERNAL

                                    - p2l:drv:sfx:deverb_#en$-s   # EXTERNAL

                            # 3
                            - p2l:decl_cl:pl:#s-0

                            # 4
                            - p2l:decl_cl:pl:#e-0:
                                summary: First constituents that are constituted by nouns that build the plural form with -e mostly have a zero linker. In compounds in which the second constituent forces a plural meaning of the given first constituent, they also attach -e- irregularly. Those that are constituted by monosyllabic animal designations that build the plural form with -e also attach -e- irregularly. Nouns that have a stressed last syllable and build the plural form with -e is the only class of nouns that can constitute first constituent that attach this linker.
                                children:

                                    - p2l:decl_cl:pl:#e-0|def-0

                                    - p2l:decl_cl:pl:#e-0|pl_interpr-e

                                    - p2l:decl_cl:pl:#e-0|msyl_anim-e

                                    - l2p:e  # EXTERNAL

                            # 5
                            - p2l:decl_cl:pl:#er-0/er:
                                summary: First constituents that are constituted by nouns that build the plural form with -(")er mostly attach a zero linker or -(")er-. A zero linker is attached after them in majority of compounds in which the second constituent forces a singular or a mass meaning of the given first constituent, and -(")er- tends to be attached after them in compounds in which the second constituent forces a plural meaning of the given first constituent. However, those that are constituted by person and animal designations that build the plural form with -(")er may attach -(")er- regardless of the singular/plural interpretation of the given first constituent within the compound. Nouns that build the plural form with -(")er is the only class of nouns that can constitute first constituent that attach this linker.
                                children:

                                    - p2l:decl_cl:pl:#er-0/er|def-0/er

                                    - p2l:decl_cl:pl:#er-0/er|!pl_interpr-0

                                    - p2l:decl_cl:pl:#er-0/er|mass-interpr-0

                                    - p2l:decl_cl:pl:#er-0/er|pl_interpr-er

                                    - p2l:decl_cl:pl:#er-0/er|anim-er

                                    - l2p:er  # EXTERNAL

                            # 6
                            - p2l:decl_cl:pl:#e_uml-0:
                                  summary: First constituents that are constituted by nouns that build the plural form with -e and umlaut mostly have a zero linker. In compounds in which the second constituent forces a plural meaning of the given first constituent, they also attach -"e- irregularly. Nouns that build the plural form with -e and umlaut is the only class of nouns that can constitute first constituent that attach this linker.
                                  children:

                                      - p2l:decl_cl:pl:#e_uml-0|def-0

                                      - p2l:decl_cl:pl:#e_uml-0|pl_interpr-e_uml

                                      - l2p:e_uml  # EXTERNAL

                            # 7
                            - p2l:decl_cl:pl:#0_uml-0:
                                summary: First constituents that are constituted by nouns that build the plural form with a zero ending and umlaut mostly have a zero linker. In compounds in which the second constituent forces a plural meaning of the given first constituent, they also attach a zero linker with umlaut irregularly. Nouns that build the plural form with a zero ending and umlaut is the only class of nouns that can constitute first constituent that attach this linker.
                                children:

                                    - p2l:decl_cl:pl:#0_uml-0|def-0

                                    - p2l:decl_cl:pl:#0_uml-0|pl_interpr-0_uml

                                    - l2p:0_uml  # EXTERNAL

                    # 8
                    - p2l:decl_cl:mixed-0/s/en:

                          summary: First constituents that are constituted by mixed masculine and neuter nouns almost always attach -s-, a zero linker, or -(e)n-. In compounds in which the second constituent forces a plural meaning of the given first constituent, they are more likely to attach -(e)n-.
                          children:

                              - p2l:decl_cl:mixed-0/s/en|def-0/s/en

                              - p2l:decl_cl:mixed-0/s/en|pl_interpr-en


            - p2l:drv:

                summary: Clusters of constraints that map derivational classes of compounds to the most probable linkers.
                children:

                    - p2l:drv:sfx:

                        summary: Clusters of constraints that map derivational suffixes of compounds to the most probable linkers.
                        children:

                            # 9
                            - p2l:drv:sfx:0_pl_sfx-0

                            # 10
                            - p2l:drv:sfx:e_pl_sfx-0

                            # 11
                            - p2l:drv:deverb_schwa$-0:
                                  summary: First constituents that are constituted by deverbal feminine nouns with a schwa suffix mostly attach a zero linker. In compounds in which the second constituent forces a plural meaning of the given first constituent, they tend to attach -n-.
                                  children:

                                    - p2l:drv:deverb_schwa$-0|def-0
                            
                                    - p2l:drv:deverb_schwa$-0|pl_interpr-en

                            # 12
                            - p2l:drv:deadj_schwa$-0/en

                            # 13
                            - p2l:drv:sfx:sfx-s:
                                summary: First constituents that are constituted by derived nouns with suffixes -(ig)keit, -heit, -schaft, -ung, -sal, -ing, -ling, -tum, -um, -ion, also -ität and its allomorphs attach -s- regularly. For the latter, -en- is preferred in compounds in which the second constituent forces a plural meaning of the given first constituent.
                                children:

                                    - p2l:drv:sfx:sfx-s|def-s

                                    - p2l:drv:sfx:sfx-s|#itaet$_pl_interpr-en

                            # 14
                            - p2l:drv:sfx:deverb_#en$-s

                            # 15
                            - p2l:drv:sfx:F_#in$-en

                    # 16
                    - p2l:drv:prx_deverb-s
                  

            - p2l:phon_fin:

                summary: Clusters of constraints that map final phoneme(s) of compounds to the most probable linkers.
                children:

                    # 17
                    - p2l:phon_fin:sibilant$-0

                    # 18
                    - p2l:phon_fin:vow$-0

                    # 19
                    - p2l:phon_fin:F_#stressed_phon$-0

                    # 20
                    - p2l:phon_fin:F_stem_#t$-s

                    # 21
                    - p2l:phon_fin:schwa$-en:
                        summary: First constituents that are constituted by nouns that end in schwa mostly adopt -n-. Those constituted by feminine nouns that end in schwa do so regularly except for the following cases. If the schwa is a deverbal suffix of such a noun and this noun is feminine, a zero linker is mostly attached except in compounds in which the second constituent forces a plural reading of the given first constituent, in which case -n- tends to be attached. If the schwa is a deadjectival suffix of such a noun and the noun is feminine, -n- or a zero linker are preferred in about the same number of cases. Nouns that end in schwa is the only class of nouns that can constitute first constituent that attach this linker.
                        children:

                            - p2l:phon_fin:schwa$-en|def-en

                            - p2l:phon_fin:schwa$-en|f-en

                            - p2l:drv:deadj_schwa$-0/en # EXTERNAL

                            - p2l:drv:deverb_schwa$-0|def-0 # EXTERNAL

                            - p2l:drv:deverb_schwa$-0|pl_interpr-en # EXTERNAL

                            - l2p:n  # EXTERNAL

                    # 22
                    - p2l:phon_fin:weak_F_cons$-0/s/en:
                        summary: First constituents that are constituted by consonant-final weak feminine nouns mostly adopt a zero linker or -s- in compounds in which the second constituent forces a singular meaning of the given first constituent. In compounds in which the second constituent forces a plural meaning of the given first constituent --- especially if the latter is final-stressed incl. monosyllabic ---, they attach -en- more likely.
                        children:

                            - p2l:phon_fin:weak_F_cons$-0/s/en|!pl_interpr-0/s

                            - p2l:phon_fin:weak_F_cons$-0/s/en|pl_interpr-en


            - p2l:sem:

                summary: Clusters of constraints that map semantic properties of compounds or its constituents to the most probable linkers.
                children:

                    - p2l:sem:comp_type:

                        summary: Clusters of constraints that map compound types to the most probable linkers.
                        children:

                            # 23
                            - p2l:sem:comp_type:copula-0

                            # 24
                            - p2l:sem:comp_type:arg-s

                    # 25
                    - p2l:sem:tech_term-0

                    # 26
                    - p2l:sem:2const_anim/pers-s


            - p2l:tend:

                summary: Clusters of constraints that describe general irregular tendencies.
                children:

                    # 27
                    - p2l:tend:cmpx_morph-s:
                        summary: The probability of -s- grows irregularly with the morphological complexity of the first constituent (any form of derivation).
                        children:

                            - p2l:tend:cmpx_morph-s|def-s

                            - p2l:drv:sfx:sfx-s|def-s  # EXTERNAL

                            - p2l:drv:sfx:deverb_#en$-s  # EXTERNAL

                            - p2l:drv:prx_deverb-s  # EXTERNAL

                    # 28
                    - p2l:tend:cmpx_phon-s:
                        summary: The probability of -s- grows irregularly with the phonological complexity of the first constituent. By phonologically complex words are understood words with polysyllable non-trochaic form, words with unstressed prefixes, words with stressed or semi-stressed suffixes etc.
                        children:

                            - p2l:tend:cmpx_phon-s|def-s

                            - p2l:drv:sfx:sfx-s|def-s  # EXTERNAL

                            - p2l:drv:prx_deverb-s  # EXTERNAL

                    # 29
                    - p2l:tend:sonority-!s


    - l2p:
    
        summary: Constraints that restrict properties of first constituents attaching certain linkers.
        children:

            # 30
            - l2p:s:
                summary: All except for a few simplex nouns that constitute first constituents that attach -s- belong to a small fixed group of masculine and neuter nouns, and many of them have a high token frequency. Almost all feminine nouns that constitute first constituents that attach -s- are morphologically complex and/or polysyllabic.
                children:

                    - l2p:s|smpx_mn

                    - l2p:s|smpx_high_freq

                    - l2p:s|f_cmpx

                    - l2p:s|f_poly_syl

            # 31
            - l2p:n

            # 32
            - l2p:en:
                summary: "All nouns that constitute first constituents that attach -(e)n- build the plural form with -(e)n, with a few idiosyncratic exceptions. The exceptions are: 1) masculine monosyllabic designations of male persons, animals, astronomic objects, months; 2) polysyllabic foreign neuter nouns that have a stressed final syllable (and mostly end in with -at and -ment) that exhibit a plural meaning within the compound."
                children:

                    - l2p:en|par

                    - l2p:en|non_par_m

                    - l2p:en|non_par_n_pl_interpr

            # 33
            - l2p:e:
                summary: All nouns that constitute first constituents that attach -e- build the plural form with -e, have a stressed last syllable, are mostly simpices and never loanwords. 
                children:

                    - l2p:e|par

                    - l2p:e|#stressed_syl

                    - l2p:e|smpx

                    - l2p:e|!loan

            # 34
            - l2p:er:
                summary: All nouns that constitute first constituents that attach -(")er- build the plural form with -(")er, have a stressed last syllable, are mostly simpices and never loanwords. 
                children:

                    - l2p:er|par

                    - l2p:er|#stressed_syl

                    - l2p:er|smpx

                    - l2p:er|!loan

            # 35
            - l2p:e_uml

            # 36
            - l2p:es:
                summary: All nouns that constitute first constituents that attach -es- belong to a fixed row of monosyllabic masculine and neuter nouns and build the genitive form with -(e)s-. -es- is thus isolated.
                children:

                    - l2p:es|isol

                    - l2p:es|mono_syl

            # 37
            - l2p:ens

            # 38
            - l2p:0_uml

            # 39
            - l2p:pl_marker


constraints:

    # 1
    def-0:
      
        summary: The majority of compounds have a zero linker. Zero linker is default for German compounds.
        ling_info_type: [default]
        appl_item: compound
        n_appl_items: 282767

        func_alias: def_0

        quantifier: majority
        coverage:
            item: 1.0
            type: 1.0
        regularity:
            item: 0.578
            type: 0.578
        support_level: supported

        examples_pro: [land_kreis, haus_tür, stadt_mauer]
        examples_contra: [land_+es_regierung, haus_+=er_block, stadt_+=e_tag]

        evidence:

            - ref: eisenberg_2013
              pages: [226]
              summary: 73% of compounds have a zero linker.

            - ref: fuhrhop_kuerschner_2015
              pages: [569]
              summary: 70% of compounds have a zero linker.

            - ref: kopf_2017
              pages: [177]
              summary: About 60% of compounds have a zero linker.

            - ref: krott_etal_2007
              pages: [3]
              summary: 60% of compounds have a zero linker.

            - ref: kuerschner_2005
              pages: [107]
              summary: 58% of compounds have a zero linker.

            - ref: libben_etal_2009
              pages: [150, 156]
              summary: The majority of compounds have a zero linker.

            - ref: nuebling_szczepaniak_2008
              pages: [2]
              summary: In most German compounds there is no linking element.

            - ref: ortner_mueller-bollhagen_1991
              pages: [50, 52, 54, 103]
              summary: Most nominal compounds have a zero linker (in about 2/3 of cases).

            - ref: schaefer_pankratz_2018
              pages: [8, 9]
              summary: 65-70% of compounds have a zero linker.

            - ref: schluecker_2012
              pages: [9]
              summary: Zero linker prevails in nominal compounds.

        footnotes: {}


    # 1. Constraints the map properties of compounds to most probable linkers.

    #   1.1. Constraints that map declination classes of compounds to most probable linkers.

    #     1.1.1. Constraints that map plural schemes of compounds to their most probable linkers.

    # 2
    p2l:decl_cl:pl:#0-0|def-0:

        summary: First constituents that are constituted by simplex masculine or neuter nouns that build the plural form with a zero ending and simplex or complex feminine nouns that build the plural form with a zero ending attach a zero linker almost regularly.
        ling_info_type: [morphological, derivational]
        appl_item: n1
        n_appl_items: 3613

        func_alias: plur_0

        quantifier: almost regularly
        coverage:
            item: 0.067
            type: 0.066
        regularity:
            item: 0.954
            type: 0.936
        support_level: supported

        examples_pro: [schlitten_fahrt, wagen_rad, ufer_promenade]
        examples_contra: [orden_+s_bruder, teufel_+s_werk, frieden_+s_angebot]

        evidence:

            - ref: ortner_mueller-bollhagen_1991
              pages: [106]
              summary: Simplex M and N that form the plural with a zero ending attach a zero linker in about 90% of cases. Null-plural F attach a zero linker in about 85% of cases.

        footnotes: {}



    # 3
    p2l:decl_cl:pl:#s-0:
    
        summary: First constituents that are constituted by nouns that build the plural form with -s attach a zero linker regularly.
        ling_info_type: [morphological]
        appl_item: n1
        n_appl_items: 3613

        func_alias: plur_s

        quantifier: regularly
        coverage:
            item: 0.035
            type: 0.033
        regularity:
            item: 0.97
            type: 0.957
        support_level: partially supported

        examples_pro: [balkon_möbel, hotel_kette, bob_bahn]
        examples_contra: [uhu_+s_nest, deck_+s_balken, interim_+s_phase, karneval_+s_kostüm]

        evidence:

            - ref: eisenberg_2013
              pages: [227]
              summary: -s- is avoided with s-plural nouns.
            
            - ref: fuhrhop_kuerschner_2015
              pages: [572]
              summary: -s- is impossible with s-plural nouns.

            - ref: kuerschner_2010
              pages: [9]
              summary: -s- almost never occurs with s-plural nouns.

            - ref: nuebling_szczepaniak_2013
              pages: [78]
              summary: -s- does not occur in s-plural nouns.
            
            - ref: ortner_mueller-bollhagen_1991
              pages: [83, 106]
              summary: s-plural nouns have a zero linker as a rule.
            
            - ref: schaefer_2018
              pages: [229]
              summary: s-plural nouns never attach -s-.
        
        footnotes:
            "1": "The given counterexample uhu_+s_nest originating from [wegener_2003:433] could not be verified. In DeReKo, there are only a few occurrences, and all of them are web pages of the site www.uhusnest.de/. Claim about 148 Google searches 'Uhusnest' in 2003 provided in the paper could not be verified either. However, we include this counterexample here assuming the authors had reasons to provide it."



