        examples_pro: [schrift_+en_verzeichnis, geburt_+en_kontrolle, burg_+en_land]
        examples_contra: [  burg_+en_blick]

        evidence:

            - ref: eisenberg_2013
              pages: [229]
              summary: Monosyllabic F sometimes adopt -en-[, sometimes a zero linker]. It is possible that there is a tendency to choose by [singular/]plural meaning.

            - ref: nuebling_szczepaniak_2008
              pages: [3]
              summary: -(e)n- sometimes has a plural meaning (especially after weak F [1]).

            - ref: nuebling_szczepaniak_2013
              pages: [80]
              summary: -en- attaches regularly to monosyllabic or polysyllabic final-stressed weak F when the plural interpretation is allowed, with a very few counterexamples.

            - ref: ortner_mueller-bollhagen_1991
              pages: [110]
              summary: Monosyllabic F adopt [zero linker or] plural suffix [2] depending on the plural meaning.

            - ref: schaefer_2018
              pages: [29]
              summary: -(e)n- exhibits a very weak positive effect on plural reading (with non-significant p-value) [3].

        footnotes:
            "1": Final phoneme (schwa/consonant) not specified.
            "2": Both weak and strong F are considered there. For strong F, see `p2l:decl_cl:pl:#e_uml-0`.
            "3": This finding concerning plural interpretability of -(e)n- is not very reliable. -(e)n- may occur after different classes of nouns, and the study indeed included occurrences of -(e)n- after nouns from these different classes. All the occurrences were analyzed altogether disregarding the class of the noun. However, as literature points out, these different classes may have different predispositions towards plural interpretability. Thus for example, the tendency of a plural reading of -(e)n- was pointed out by a few papers for F with a stress on the last syllable (incl. monosyllabic F), which is not the case for trochaic F or weak masculines. Thus, making a single conclusion about all occurrences from different classes adopting -(e)n- may be misleading since strong effect of one class may be wiped out by the absence of the same effect for the others. However, since even with this averaging over the classes, the overall effect is positive (even if weakly), we include this finding in the evidence, assuming the effect of -(e)n- after F with a stress on the last syllable (incl. monosyllabic F) was most probably positive as well.


