    # 5
    p2l:decl_cl:pl:#e-0|pl_interpr-e:
    
        summary: First constituents that are constituted by nouns that build the plural form with -e attach -e- irregularly in compounds in which the second constituent forces a plural meaning of the given first constituent.
        ling_info_type: [morphological, semantic]
        appl_item: n1
        n_appl_items: 3613

        func_alias: plur_e_pl

        quantifier: irregularly
        coverage:
            item: NA
            type: NA
        regularity:
            item: NA
            type: NA
        support_level: NA

        examples_pro: [projekt_+e_macherei, tag_+e_buch, punkt_+e_stand]
        examples_contra: [pilz_sammler, brot_korb, jahr_zehnt,  tag_+e_lohn]

        evidence:

            - ref: ortner_mueller-bollhagen_1991
              pages: [103]
              summary: -e- mostly signalizes a plural meaning.'

            - ref: schaefer_pankratz_2018
              pages: [29]
              summary: -e- exhibits insignificant effect on plural reading [1].

        footnotes:
            "1": This finding is not very reliable. Most of the entries in the dataset were nouns designating animals -- that, as pointed out in the literature, tendentially attach -e- with no respect to the plural meaning (see `p2l:decl_cl:pl:#e-0|msyl_anim-e`). Furthermore, the sample contained noise such as 'Arzt' which is a e=plural noun. Thus, making a single conclusion about all occurrences from different classes adopting -e- may be misleading since strong effect of one class may be wiped out by the absence of the same effect for the others. However, since even with this averaging over the classes, the overall effect is positive (even if weakly), we include this finding in the evidence, assuming the effect of -e- after non-animal designations was most probably positive as well.


