              pages: [230, 231]
              summary: Linkers identical to the plural ending are tendentially associated with plural meaning. When the second constituent denotes something that forces the first constituent to take a collective or plural meaning, the latter prefers its plural ending as a linking element.

            - ref: schluecker_2023
              pages: [20]
              summary: Linkers identical to the plural ending can be [2] associated with plural meaning.

            - ref: wegener_2005
              pages: [173]
              summary: First constituents of compounds often occur with a linker identical to the plural ending when no plural meaning is intended [1].

