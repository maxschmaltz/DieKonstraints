              pages: [63, 64]
              summary: "The probability of a linking element to appear decreases as the compound type becomes closer to syntax: determinative compounds adopt explicit linkers non-systematically; copulative compounds with additive relations can adopt explicit linkers, but less frequently; copulative compounds with appositive relations systematically adopt a zero linker [1]."

            - ref: neef_borgwaldt_2012
              pages: [31, 32]
              summary: Copulative compounds do not attach explicit linkers.

            - ref: ortner_mueller-bollhagen_1991
              pages: [57, 91, 94, 109]
              summary: Copulative compounds always have a zero linker[; in particular, weak M as well as F ending with suffix -in always adopt -en- unless they are copulative, in which case they have a zero linker [2]].

