    #     1.1.2. Constraints for mixed nouns.

    # 16
    p2l:decl_cl:mixed-0/s/en|def-0/s/en:
      
        summary: First constituents that are constituted by mixed masculine and neuter nouns almost always attach -s-, a zero linker, or -(e)n-.
        ling_info_type: [morphological]
        appl_item: n1
        n_appl_items: 3613

        func_alias: mixed_mn

        quantifier: almost always
        coverage:
            item: 0.013
            type: 0.013
        regularity:
            item: 0.997
            type: 0.996
        support_level: supported

        examples_pro: [staat_+s_amt, staat_+en_bund, bett_anzug, auge_+n_lied]
        examples_contra: [schmerz_+ens_schrei]

        evidence:

            - ref: krott_etal_2007
              pages: [3]
              summary: Consonant-final M [1] adopt -en- [less productively].

            - ref: nuebling_szczepaniak_2013
              pages: [80]
              summary: Monosyllabic M and N [1] with plural interpretation sometimes attach -en-.

            - ref: ortner_mueller-bollhagen_1991
              pages: [92]
              summary: Mixed M mostly attach a zero linker or an -s-. Mixed M can also attach an -(e)n- [if the second constitiuent forces its plural meaning].

            - ref: schaefer_2018
              pages: [229]
              summary: Mixed M and N often (but surely not always) adopt -s- [2, 3, 4].

            - ref: schaefer_pankratz_2018
              pages: [9]
              summary: Mixed M and N often occur with -(e)n-.

        footnotes:
            "1": "Even though these papers do not explicitly say 'mixed M and N', the examples they provide are all mixed M and N: farm_+en_verkauf, staat_+en_bund, bett_+en_zahl."
            "2": The original text refers to both strong and mixed M.
            "3": The original text says -(e)s- but since 1) we divide -s- and -es- these two in our research and 2) -es- is handled separately in `l2p:es`, we modify it to -s- here.
            "4": Since from the whole class of strong and mixed M and N taking -s- and -es- mentioned in the paper we only consider the subclass of mixed M and N taking -s- here, the evidence is to be considered indirect. The rest of the claim about strong M and N consideres such a broad class that we disregard it in this iteration.
            "5": The "almost always" quantifier bases on the fact that no further linkers are attributed to mixed M and N in the literature; still, since none of the claims takes on to deem any of the linkers regular for these nouns, we leave a possibility of another links open by adding "almost" in the quantifier.


