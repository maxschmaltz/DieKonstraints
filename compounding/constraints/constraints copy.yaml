-   id: cons_final_f
    summary: 'Consonant-final simplex F mostly adopt either -en-, or a zero linker, or -s-. It is possible that there is a tendency to choose by singular/plural meaning: if the second constituent forces the first constituent to take a collective or plural meaning, -en- is more likely (especially in final-stressed F), otherwise mostly a zero linker or -s- is chosen. Monosyllabic F adopt zero linker or plural suffix (-en- or =e=) depending on the plural meaning.'
    type:
        - morphological
        - phonological
        - semantic
    regularity: NA
    coverage: NA
    evidence:
          - ref: eisenberg_2013
            pages:
                - 229
            summary: 'One-syllable F sometimes adopt -en-, sometimes a zero linker. It is possible that there is a tendency to choose by singular/plural meaning.'
          - ref: krott_etal_2007
            pages:
                - 3
            summary: Consonant-final F adopt -en- less productively.
          - ref: nübling_szczepaniak_2008
            pages:
                - 3
            summary: '-(e)n- sometimes has a plural meaning (especially after weak F [1]).'
          - ref: nübling_szczepaniak_2013
            pages:
                - 80
            summary: '-en- attaches regularly to monosyllabic or polysyllabic final-stressed weak F when the plural interpretation is allowed, with a very few counterexamples. If the plural reading is inadequate, another linking element, mostly -s- or zero, has to be chosen.'
          - ref: ortner_müller-bollhagen_1991
            pages:
                - 94, 110
            summary: 'F not ending in -e do not usually attach -en-; if there is a singular interpretation, they attach a zero linker. \ Monosyllabic F adopt zero linker or plural suffix (-en- or =e= (`p2l:decl_cl:pl:#e_uml-0`)) depending on the plural meaning."
          - ref: schäfer_2018
            pages:
                - 29
            summary: '-(e)n- exhibits a very weak positive effect on plural reading (with non-significant p-value) [2].'
    examples_pro:
        - schrift_+en_verzeichnis
        - schrift_führer
        - geburt_+en_kontrolle
        - geburt_+s_tag
    examples_contra:
        - burg_+en_blick
    footnotes:
        '1': Final phoneme (schwa/consonant) not specified.
        '2': 'This finding concerning plural interpretability of -(e)n- is not very reliable. -(e)n- may occur after different classes of nouns, and the study indeed included occurrences of -(e)n- after nouns from these different classes. All the occurrences were analyzed altogether disregarding the class of the noun. However, as literature points out, these different classes may have different predispositions towards plural interpretability. Thus for example, the tendency of a plural reading of -(e)n- was pointed out by a few papers for F with a stress on the last syllable (incl. monosyllabic F), which is not the case for trochaic F or weak masculines. Thus, making a single conclusion about all occurrences from different classes adopting -(e)n- may be misleading since strong effect of one class may be wiped out by the absence of the same effect for the others. However, since even with this averaging over the classes, the overall effect is positive (even if weakly), we include this finding in the evidence, assuming the effect of -(e)n- after F with a stress on the last syllable (incl. monosyllabic F) was most probably positive as well.'
-   id: schwa
    summary: 'Nouns ending in schwa regularly adopt -n- if the schwa is not a suffix, this is the only class of words that can attach this linker. If the schwa is a suffix of a deadjective F, -n- and zero linkers are about equally possible. Deverbal F with the schwa suffix mostly attach a zero linker but can attach an -n- when the first constituent has a plural reading.'
    type:
        - phonological
        - derivational
        - semantic
    regularity: NA
    coverage: NA
    evidence:
          - ref: eisenberg_2013
            pages:
                - 229
            summary: F ending in schwa (they are already two-syllabic) regularly adopt -n-.
          - ref: fuhrhop_kürschner_2015
            pages:
                - 573
            summary: 'F ending in schwa adopt -n- if schwa is not a suffix, otherwise a zero linker.'
          - ref: krott_etal_2007
            pages:
                - 3
            summary: F ending in schwa adopt -n- productively.
          - ref: kürschner_2005
            pages:
                - 112
            summary: 'The claim that F ending in schwa always attach a zero linker is not supported by the empirical data, but it should be marked as a tendency [1].'
          - ref: kürschner_2010
            pages:
                - 18
            summary: '-n- occurs only after schwa, and most of the words ending with a schwa adopt it.'
          - ref: libben_etal_2009
            pages:
                - 151
                - 157
            summary: 'F ending in schwa will almost always attach an -n- with a very few exceptions [2].'
          - ref: ortner_müller-bollhagen_1991
            pages:
                - 83
                - 92
                - 93
            summary: 'Nouns (especially weak F) ending in schwa mostly adopt -n-. However, deadjective F ending in a schwa suffix have a zero linker or -n- in about the same number of cases. Deverbative F ending in schwa suffix  mostly have a zero linker; they can attach an -n- though when the first constituent has a plural reading [3, 4].'
          - ref: schäfer_pankratz_2018
            pages:
                - 9
            summary: F ending in schwa virtually always occur with -n-.
    examples_pro:
        - biene_+n_zucht
        - suppe_+n_schüssel
        - fläche_+e_maß
        - hitze_welle
        - abgabe_soll
        - abgabe_+n_ordnung
        - sorge_pflicht
        - auge_+n_lied
        - interesse_+n_bereich
    examples_contra:
        - kohle_filter
        - gebäude_komplex
    footnotes:
        '1': 'The counterexample there is a deadjective F: tiefe_+n_meter, which is in line with the overall constraint.'
        '2': "The exception given there is kohle_berg_werk; a variant kohle_+n_berg_werk coexists. Let's consider further counterexample kohle_filter provided here without a coexisting *kohle_+n_filter. Both kohle_berg_werk and kohle_filter can be accounted for if we assume the constraint `p2l:sem:tech_term-0` is stronger than `p2l:phon_fin:schwa$-en|def-en` and thus -- since these are technical terms -- it blocks the application of `p2l:phon_fin:schwa$-en|def-en` in these cases."
        '3': "A further claim was made in the paper: 'Finally, further F ending in schwa can adopt an -n- if they denote a concrete countable, even if no plural meaning occurs'. However, these cases simply fall into the cases of F ending in a non-suffix schwa and are only a subset thereof."
        '4': "Mixed and irregular M and N ending in schwa also fall here: 'Auge', 'Interesse' can be handled assuming `p2l:phon_fin:schwa$-en|def-en` > `p2l:decl_cl:mixed-0/s/en|def-0/s/en`. However, many of further examples are eventually overtaken by other constraints: 'Name', 'Glaube'. etc. are governed by `l2p:ens` (assuming `l2p:ens` > `p2l:phon_fin:schwa$-en|def-en`); 'Ende' mostly removes the schwa and is thus not considered in this iteration; 'Gebäude' is eventually governed by `def-0` (assuming none else is applicable)."
-   id: copula
    summary: Copulative compounds regularly attach a zero linker.
    type:
        - semantic
    regularity: NA
    coverage: NA
    evidence:
          - ref: koliopoulou_2014
            pages:
                - 63
                - 64
            summary: 'The probability of a linking element to appear decreases as the compound type becomes closer to syntax: determinative compounds adopt explicit linkers non-systematically; copulative compounds with additive relations can adopt explicit linkers, but less frequently; copulative compounds with appositive relations systematically adopt a zero linker [1].'
          - ref: neef_borgwaldt_2012
            pages:
                - 31
                - 32
            summary: Copulative compounds do not attach explicit linkers.
          - ref: ortner_müller-bollhagen_1991
            pages:
                - 57
                - 91
                - 94
                - 109
            summary: 'Copulative compounds always have a zero linker. In particular, weak M as well as F ending with suffix -in always adopt -en- unless they are copulative, in which case they have a zero linker [2].'
    examples_pro:
        - dichter_componist
        - bett_sofa
        - königin_mutter
    examples_contra:
        - ''
    footnotes:
        '1': "The author defines two different types of copulative compounds: with additive relations and with appositive relations. However, this notation is not conventional. What the author calls 'copulative compounds with additive relations' are not defined as copulative compounds in most of the literature, while what the author calls 'copulative compounds with appositive relations' are what is defined \"usual\" copulative compounds. Thus, in our terms this finding can be summarized as 'non-copulative compounds adopt explicit linkers non-systematically, while copulative compounds systematically adopt a zero linker'."
        '2': 'Evidence for `p2l:sem:comp_type:copula-0` > weak M (disregarded), `p2l:drv:sfx:F_#in$-en`.'
