    # 35
    p2l:phon_fin:weak_F_cons$-0/s/en|pl_interpr-en:
    
        summary: First constituents that are constituted by consonant-final weak feminine nouns --- especially final-stressed incl. monosyllabic ones --- attach -(e)n- more likely in compounds in which the second constituent forces a plural meaning of the given first constituent.
        ling_info_type: [morphological, phonological, semantic]
        appl_item: n1
        n_appl_items: 3613

        func_alias: f_cons_fin_pl

        quantifier: more likely
        coverage:
            item: NA
            type: NA
        regularity:
            item: NA
            type: NA
        
        examples_pro: [schrift_+en_verzeichnis, geburt_+en_kontrolle, burg_+en_land]
        examples_contra: [  burg_+en_blick]

        evidence:

            - ref: eisenberg_2013
              pages: [229]
              summary: Monosyllabic F sometimes adopt -en-[, sometimes a zero linker]. It is possible that there is a tendency to choose by [singular/]plural meaning.

            - ref: nuebling_szczepaniak_2008
              pages: [3]
              summary: -(e)n- sometimes has a plural meaning (especially after weak F [1]).

            - ref: nuebling_szczepaniak_2013
              pages: [77, 80, 83, 84, 87]
              summary: "-en- after (monosyllabic or polysyllabic) final-stressed weak F is linked to plural: it attaches regularly to them when the plural interpretation is allowed, with a very few counterexamples, and they regularly exhibit a plural meaning when occurring with the linker -(e)n-."

            - ref: ortner_mueller-bollhagen_1991
              pages: [110]
              summary: Monosyllabic weak [2] F [mostly] adopt a [zero linker or] plural suffix only when a plural meaning is present.

            - ref: schaefer_2018
              pages: [29]
              summary: -(e)n- exhibits a very weak positive effect on plural reading (with non-significant p-value) [3].

        footnotes:
            "1": Final phoneme (schwa/consonant) not specified.
            "2": The original fragment considers both weak F and strong F. For the latter F, see `p2l:decl_cl:pl:#e_uml-0|pl_interpr-e_uml`.
            "3": This finding concerning plural interpretability of -(e)n- is not very reliable. -(e)n- may occur after different classes of nouns, and the study indeed included occurrences of -(e)n- after nouns from these different classes. All the occurrences were analyzed altogether disregarding the class of the noun. However, as literature points out, these different classes may have different predispositions towards plural interpretability. Thus for example, the tendency of a plural reading of -(e)n- was pointed out by a few papers for F with a stress on the last syllable (incl. monosyllabic F) (see [nuebling_szczepaniak_2013]), which is not the case for trochaic F or weak masculines. Thus, making a single conclusion about all occurrences from different classes adopting -(e)n- may be misleading since strong effect of one class may be wiped out by the absence of the same effect for the others. However, since even with this averaging over the classes, the overall effect is positive (even if weakly), we include this finding in the evidence, assuming the effect of -(e)n- after F with a stress on the last syllable (incl. monosyllabic F) was most probably positive as well.


