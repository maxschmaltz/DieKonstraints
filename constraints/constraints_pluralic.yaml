    # 10
    p2l:decl_cl:pl:#er-0/er|pl_interpr-er:
    
        summary: First constituents that are constituted by nouns that build the plural form with -(")er attach -(")er- more likely in compounds in which the second constituent forces a plural meaning of the given first constituent.
        ling_info_type: [morphological, semantic]
        appl_item: n1
        n_appl_items: 3613

        func_alias: plur_er_pl

        quantifier: more likely
        coverage:
            item: NA
            type: NA
        regularity:
            item: NA
            type: NA
        
        examples_pro: [buch_+=er_regal, grab_+=er_feld, kraut_+=er_frau]
        examples_contra: [buch_handel, bild_band,   kind_+=er_jacke, mann_+=er_herz]

        evidence:

            - ref: eisenberg_2013
              pages: [229]
              summary: er-plural nouns tend to choose -(")er- when a plural meaning is present.

            - ref: fuhrhop_1996
              pages: [544, 545]
              summary: -(")er- is productive when an explicit plural meaning is present. A plural meaning of the first constituent is a necessary condition for -(")er-. However, there are words in which the plural status is not confirmed.

            - ref: nuebling_szczepaniak_2013
              pages: [80, 81, 84, 87]
              summary: -(")er- is often associated with plural meaning, with many counterexamples.

            - ref: ortner_mueller-bollhagen_1991
              pages: [99, 102]
              summary: 3/4 of er-plural compounds with a plural meaning of the first constituent signalize this plural meaning with -(")er.

            - ref: schaefer_pankratz_2018
              pages: [29]
              summary: -(")er- with no umlauting exhibits moderate, and -(")er- with umlauting exhibits significantly strong effect on plural reading.
              
        footnotes: {}
    

