    # 64
    l2p:pl_marker|def-pl:
      
        summary: Linkers that are identical to the plural ending of the first constituent (except for -s- and zero linker) in a given compound tend to be associated with a plural meaning of this first constituent within the compound.
        ling_info_type: [morphological, semantic]
        appl_item: n1+linker
        n_appl_items: 4868

        func_alias: pl_interpr

        quantifier: tend
        coverage:
            item: NA
            type: NA
        regularity:
            item: NA
            type: NA
        
        examples_pro: [punkt_+e_stand, buch_+=er_regal, staat_+en_bund, burg_+en_land, mutter_+=_zentrum]
        examples_contra: [motor_+en_geräusch, burg_+en_blick, kind_+=er_jacke, hund_+e_leine,   pilz_sammler, buch_handel, vogel_futter]

        evidence:

            - ref: fuhrhop_1996
              pages: [531]
              summary: When the first constituents occur in their plural form, it often points to a plural meaning. However, this [plural meaning] is not enough [to cause the pluralic linker].

            - ref: koester_etal_2004
              pages: [1655, 1657, 1659, 1661, 1662]
              summary: When presented auditorily, linkers that are equivalent to plural endings are not perceived as having plural meaning [1, 2].

            - ref: ortner_mueller-bollhagen_1991
              pages: [110]
              summary: When a plural meaning should be reinforced, the linker identical to the plural ending may appear instead of a zero linker [3].

            - ref: schaefer_2018
              pages: [230, 231]
              summary: Linkers identical to the plural ending tend to be associated with plural meaning. When the second constituent denotes something that forces the first constituent to take a collective or plural meaning, the latter prefers its plural ending as a linking element. However, there is no regularity in when a plural linker should be present and when it should necessarily express a plural meaning.

            - ref: schaefer_pankratz_2018
              pages: [1, 3, 29, 37]
              summary: There is an overall tendency that German language users do use pluralic linking elements as cues to the internal plural interpretation of N+N compounds [4].

            - ref: wegener_2005
              pages: [173]
              summary: First constituents of compounds often occur with a linker identical to the plural ending when no plural meaning is intended [1].

        footnotes:
            "1": The irreguarity of this constraint is quite high, which is supported by the fact that this evidence contradicts its definition.
            "2": Cited by [krott_etal_2007:3], [nuebling_szczepaniak_2013:77]. An explanation to the negativity of the results is also suggested in [schaefer_pankratz_2018:39].
            "3": Even though the original text does not explicitly say that the linker identical to the plural ending is preferred in this case, all the examples provided for this claim have such linkers.
            "4": Cited by [schluecker_2023:20].