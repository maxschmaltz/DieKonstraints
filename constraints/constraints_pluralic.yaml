# Part 1: README

readme: For the full README, notes, glossary, and topology, see the corresponding part of [`constraints_all_revised.yaml`](./constraints_all_revised.yaml). This file contains only such constraints from `constraints_all_revised.yaml` that deal with the relation between the signular/plural meaning of the first constituent and the probability of the pluralic linker.

---

# Part 2: ENTRIES

constraints:

    # 5
    p2l:decl_cl:pl:#e-0|pl_interpr-e:
    
        summary: First constituents that are constituted by nouns that build the plural form with -e attach -e- irregularly in compounds in which the second constituent forces a plural meaning of the given first constituent.
        ling_info_type: [morphological, semantic]
        appl_item: n1
        n_appl_items: 3613

        func_alias: plur_e_pl

        quantifier: irregularly
        coverage:
            item: NA
            type: NA
        regularity:
            item: NA
            type: NA
        
        examples_pro: [projekt_+e_macherei, tag_+e_buch, punkt_+e_stand]
        examples_contra: [pilz_sammler, brot_korb, jahr_zehnt,  tag_+e_lohn]

        evidence:

            - ref: ortner_mueller-bollhagen_1991
              pages: [103]
              summary: -e- mostly signalizes a plural meaning.'

            - ref: schaefer_pankratz_2018
              pages: [29]
              summary: -e- exhibits insignificant effect on plural reading [1].

        footnotes:
            "1": This finding is not very reliable. Most of the entries in the dataset were nouns designating animals -- that, as pointed out in the literature, tend to attach -e- with no respect to the plural meaning (see `p2l:decl_cl:pl:#e-0|msyl_anim-e`). Furthermore, the sample contained noise such as 'Arzt' which is a e=plural noun. Thus, making a single conclusion about all occurrences from different classes adopting -e- may be misleading since strong effect of one class may be wiped out by the absence of the same effect for the others. However, since even with this averaging over the classes, the overall effect is positive (even if weakly), we include this finding in the evidence, assuming the effect of -e- after non-animal designations was most probably positive as well.


    # 8
    p2l:decl_cl:pl:#er-0/er|!pl_interpr-0:
    
        summary: First constituents that are constituted by nouns that build the plural form with -(")er attach a zero linker in a majority of compounds in which the second constituent forces a singular meaning of the given first constituent.
        ling_info_type: [morphological, semantic]
        appl_item: n1
        n_appl_items: 3613

        func_alias: plur_er_sg

        quantifier: majority
        coverage:
            item: NA
            type: NA
        regularity:
            item: NA
            type: NA
        
        examples_pro: [buch_deckel, grab_stein, blatt_fläche]
        examples_contra: [mann_+=er_herz, kind_+=er_bild,   buch_handel]

        evidence:

            - ref: eisenberg_2013
              pages: [229]
              summary: Nouns forming the plural with -(")er tend to choose a zero linker [1] when no plural meaning is present.

            - ref: nuebling_szczepaniak_2013
              pages: [81]
              summary: -(")er- alternates with other linking elements with singular reading [2].
              
            - ref: ortner_mueller-bollhagen_1991
              pages: [102, 108]
              summary: 80% er-plural nouns having a singular meaning choose a zero linker [3].
              
        footnotes:
            "1": Even though original text reads 'otherwise a zero linker or another linker', none of the provided examples illustrate the use of linkers other than zero or -(")er-.
            "2": Since -(")er- is always paradigmatic, the claim concerns (")er-plural nouns.
            "3": Note that non-N+N compounds are included in this statistics.


